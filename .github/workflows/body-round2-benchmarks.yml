name: body-round2-benchmarks

# Evidence-only workflow: never runs in the upstream repository or on PR code.
on:
  push:
    branches:
      - validation/body-round2-evidence-20261120

permissions:
  contents: read

env:
  SOURCE_SHA: 5226860c1d70bc7fc6619cf79aff10c4f9a2a234
  BASELINE_SHA: d74848fb33dbff1d719959df19d1266a1ac60f44
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

concurrency:
  group: body-round2-benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.repository == 'STARDUSTLC666/lingshu'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            label: py312-latest
            pinned_deps: ""
          - python: "3.12"
            label: py312-floor
            pinned_deps: "numpy==2.3.5 Pillow==12.3.0"
          - python: "3.13"
            label: py313-latest
            pinned_deps: ""
    steps:
      - name: Check out evidence driver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: evidence
          persist-credentials: false
      - name: Validate frozen source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out exact combined source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare independent exact baseline archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          git -C source cat-file -e "$BASELINE_SHA^{commit}"
          mkdir baseline-root
          git -C source archive "$BASELINE_SHA" | tar -x -C baseline-root
          printf '%s\n' "$BASELINE_SHA" > baseline-root/.source-commit
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the upstream full and dev dependencies
        shell: bash
        env:
          PINNED_DEPS: ${{ matrix.pinned_deps }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/body-round2-output"
          python -m pip install --upgrade pip 2>&1 | tee "$RUNNER_TEMP/body-round2-output/pip-upgrade.log"
          python -m pip install -e './source[full,dev]' 2>&1 | tee "$RUNNER_TEMP/body-round2-output/pip-install.log"
          if [ -n "$PINNED_DEPS" ]; then
            python -m pip install $PINNED_DEPS 2>&1 | tee "$RUNNER_TEMP/body-round2-output/pip-floor.log"
          fi
          python -m pip freeze > "$RUNNER_TEMP/body-round2-output/pip-freeze.txt"
      - name: Run all four A/B benchmarks and 27 named mutants
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 -B evidence/validation/body-round2-20261120/tools/run_round2_linux_benchmarks.py \
            --source "$GITHUB_WORKSPACE/source" \
            --baseline-root "$GITHUB_WORKSPACE/baseline-root" \
            --output "$RUNNER_TEMP/body-round2-output" \
            --source-sha "$SOURCE_SHA" --baseline-sha "$BASELINE_SHA" \
            2>&1 | tee "$RUNNER_TEMP/body-round2-output/driver.log"
      - name: Upload raw evidence even when validation fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: body-round2-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/body-round2-output/**
            !${{ runner.temp }}/body-round2-output/**/tmp/**
            !${{ runner.temp }}/body-round2-output/**/sandbox/**
            !${{ runner.temp }}/body-round2-output/**/guard-*/**
            !${{ runner.temp }}/body-round2-output/**/__pycache__/**
            !${{ runner.temp }}/body-round2-output/**/*.db
            !${{ runner.temp }}/body-round2-output/**/*.sqlite
            !${{ runner.temp }}/body-round2-output/**/*.sqlite3
