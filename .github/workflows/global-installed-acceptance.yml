name: global installed acceptance

# Separate from the existing three full-gate lanes: optional sparse dependencies
# and clean wheel installation should not change their dependency coverage.
on:
  push:
    branches: [validation/global-final-evidence-20261121]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-installed-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: 0f7427549406ad125d7efc95da5ceece052e616d
  SOURCE_TREE: 0f33bd5642db088a459aebd6750cc1c68715f10e
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  contracts:
    name: historical physics and sparse backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify frozen integration source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared test and sparse extras
        run: python -m pip install -e ".[dev,core-sparse]"
      - name: Run authentic historical and real sparse contracts without skips
        env:
          ACCEPTANCE_OUTPUT: ${{ runner.temp }}/extended-contracts
        shell: bash
        run: python -X utf8 tools/testing/extended_body_acceptance.py contracts --fetch-baseline --output "$ACCEPTANCE_OUTPUT"
      - name: Retain raw contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: extended-contracts
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/extended-contracts/*.json
            ${{ runner.temp }}/extended-contracts/*.xml
            ${{ runner.temp }}/extended-contracts/*.log

  wheel:
    name: installed wheel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify frozen integration source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build and accept wheel in new light and full environments
        env:
          ACCEPTANCE_OUTPUT: ${{ runner.temp }}/wheel-acceptance
        shell: bash
        run: python -X utf8 tools/testing/extended_body_acceptance.py wheel --output "$ACCEPTANCE_OUTPUT"
      - name: Retain wheel, raw JSON, pixels and installation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: installed-wheel-${{ matrix.os }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/wheel-acceptance/*.json
            ${{ runner.temp }}/wheel-acceptance/*.log
            ${{ runner.temp }}/wheel-acceptance/*-journey/*.json
            ${{ runner.temp }}/wheel-acceptance/*-journey/*.log
            ${{ runner.temp }}/wheel-acceptance/*-journey/*.png
            ${{ runner.temp }}/wheel-acceptance/dist/*.whl
